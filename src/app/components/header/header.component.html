<header class="header" [class.scrolled]="scrolled">
  <div class="header-container">
    <!-- Logo -->
    <a routerLink="/inicio" class="header-logo" (click)="closeMenu()">
      <div class="logo-shield">
        <img src="images/logo.png" alt="Avellaneda FC" class="logo-img">
      </div>
      <span class="logo-text">AVELLANEDA FC</span>
    </a>

    <!-- Desktop Nav -->
    <nav class="header-nav" [class.open]="mobileMenuOpen">
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="active"
         class="nav-link"
         (click)="closeMenu()">
        {{ link.label }}
      </a>
      <!-- Mobile login -->
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn btn-primary mobile-login" (click)="closeMenu()">
          <i class="fa-regular fa-user"></i> Iniciar sesión
        </a>
      </ng-container>
    </nav>

    <!-- Perfil o inicio de sesión + menú móvil -->
    <div class="header-actions">
      <ng-container *ngIf="!isLoggedIn; else desktopProfile">
        <a routerLink="/login" class="btn-login">
          <i class="fa-regular fa-user"></i>
          <span>Iniciar sesión</span>
        </a>
      </ng-container>
      <ng-template #desktopProfile>
        <div class="profile-menu relative" (click)="$event.stopPropagation()">
          <button type="button" class="profile-trigger" [attr.aria-expanded]="profileMenuOpen" aria-haspopup="menu" (click)="toggleProfileMenu()">
            <span class="profile-avatar">{{ usuarioIniciales }}</span>
            <span class="profile-trigger-name">{{ usuarioNombre }}</span>
            <i class="fa-solid fa-chevron-down profile-chevron" [class.rotated]="profileMenuOpen" aria-hidden="true"></i>
          </button>
          <div class="profile-dropdown absolute z-50" *ngIf="profileMenuOpen" role="menu">
            <div class="profile-card-user">
              <span class="profile-avatar profile-avatar-large">{{ usuarioIniciales }}</span>
              <div class="profile-user-copy">
                <strong>{{ usuarioNombre }}</strong>
                <span class="profile-role">{{ usuarioRol }}</span>
                <span class="profile-email">{{ usuarioEmail }}</span>
              </div>
            </div>
            <button type="button" class="dropdown-logout" role="menuitem" (click)="logout()">
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
              <span>Cerrar sesión</span>
            </button>
          </div>
        </div>
      </ng-template>

      <button class="hamburger" (click)="toggleMenu()" [class.open]="mobileMenuOpen" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div class="mobile-overlay" [class.open]="mobileMenuOpen" (click)="closeMenu()"></div>
</header>
